spring.application.name=leadproject
server.port=8080

# Default local development database: use H2 so the app runs without a local Postgres timezone issue.
# Override with DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD for Postgres in Docker or production.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:leadproject;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA
# If the Docker Postgres volume still contains a stale schema from a previous failed startup,
# run: docker compose down -v && docker compose up --build
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security
spring.security.user.name=${APP_ADMIN_USERNAME:admin}
spring.security.user.password=${APP_ADMIN_PASSWORD:admin123}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}

# Spring AI (OpenAI)
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Voice provider configuration
# Set one provider at a time. Use either Twilio or Plivo by populating the matching values.
voice.provider=${VOICE_PROVIDER:twilio}

# Twilio
# These values should be set in the environment or real deployment config.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+17372508034}
twilio.app-base-url=${TWILIO_APP_BASE_URL:https://leadproject-59dl.onrender.com}
twilio.record-call=${TWILIO_RECORD_CALL:false}

# Plivo
plivo.auth-id=${PLIVO_AUTH_ID:}
plivo.auth-token=${PLIVO_AUTH_TOKEN:}
plivo.phone-number=${PLIVO_PHONE_NUMBER:}
plivo.app-base-url=${PLIVO_APP_BASE_URL:http://localhost:8080}
